<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App do Ivo</title>
<meta name="description" content="Apps by Ivo Lopes. Each app is an atom in one molecule.">
<meta property="og:title" content="App do Ivo">
<meta property="og:description" content="Apps by Ivo Lopes. Each app is an atom in one molecule.">
<meta property="og:url" content="https://appdoivo.com">
<meta property="og:type" content="website">
<meta property="og:image" content="https://appdoivo.com/og-image.png?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://appdoivo.com">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f1dfc6">
<meta name="color-scheme" content="only light">
<link rel="preload" as="image" href="img/paper.webp?v=1">
<link rel="preload" as="image" href="img/atom-orange.webp?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
  /* A glass-and-steel molecule on graph paper (from the ChatGPT mockups,
     ~/Downloads/apps-refs/v1). Each app is an atom bonded to App do Ivo, which
     is also the contact; the pale empty atoms are room for apps to come. */
  :root {
    --paper: #f1dfc6; --ink: #2a2520; --muted: #5a5147; --pencil: rgba(96, 88, 78, .5);
    --mono: "Courier Prime", "Courier New", monospace; --sans: Inter, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--paper) url(img/paper.webp?v=1) center / cover fixed; color: var(--ink); font-family: var(--mono);
    display: grid; grid-template-rows: auto 1fr; min-height: 100svh;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .site { font-size: clamp(16px, 2vw, 20px); letter-spacing: .02em; }
  .lang {
    width: 52px; height: 52px; border-radius: 50%; cursor: pointer; font: 700 16px var(--mono); color: var(--ink);
    background: radial-gradient(circle at 35% 30%, #fffaf0, #f3e4cc 70%); border: 1px solid rgba(120, 100, 80, .25);
    box-shadow: 0 4px 10px -4px rgba(80, 55, 30, .45), inset 0 1px 0 #fff;
  }
  .lang:hover { background: #fffaf0; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

  main { display: grid; place-items: center; padding-block: 8px 24px; }
  .molecule { position: relative; width: min(1120px, 100%, 140svh); aspect-ratio: 3 / 2; }
  @media (max-aspect-ratio: 4/5) { .molecule { width: min(100%, 58svh); aspect-ratio: 2 / 3; } }

  /* Bonds: steel rods between ball centres (placed by the script); dashed pencil lines to the empty atoms */
  .bond { position: absolute; left: 0; top: 0; height: var(--h, 12px); transform-origin: 0 50%; translate: 0 -50%; pointer-events: none;
          background: url(img/rod.png?v=1) repeat-x center / auto 100%; filter: drop-shadow(0 3px 2px rgba(80, 55, 30, .25)); }
  .ghosts { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .ghosts line { stroke: var(--pencil); stroke-width: 1; stroke-dasharray: 5 6; vector-effect: non-scaling-stroke; }

  .atom { position: absolute; left: var(--x); top: var(--y); width: var(--d); aspect-ratio: 1; translate: -50% -50%; color: inherit; text-decoration: none; border-radius: 50%; }
  .atom .ring { position: absolute; left: 50%; top: 50%; width: var(--rw, 150%); translate: -50% -50%; max-width: none; pointer-events: none; }
  .atom .glass { position: absolute; left: -10.5%; top: -10.5%; width: 124%; max-width: none; transition: transform .3s ease; transform-origin: 42% 42%; }
  .atom.core .glass { left: -7%; top: -7%; width: 119%; }
  a.atom:hover .glass, a.atom:focus-visible .glass { transform: scale(1.05); }
  .sym { position: absolute; inset: 0; display: grid; place-content: center; color: #fff; font: 600 calc(var(--d) * .3)/1 var(--sans);
         text-shadow: 0 1px 6px rgba(0, 0, 0, .25); pointer-events: none; }
  .sym { font-size: var(--sym, 40px); }

  /* The details: always on touch screens; on a mouse, they appear on hover or focus */
  .label { position: absolute; display: grid; gap: 4px; width: max-content; max-width: min(270px, 44vw); pointer-events: none; transition: opacity .25s ease, translate .25s ease; }
  .name { font-weight: 700; font-size: clamp(20px, 2vw, 26px); line-height: 1; }
  .what, .go { font-size: clamp(14px, 1.1vw, 15px); }
  .what { color: var(--muted); }
  .go { text-decoration: underline; text-underline-offset: 3px; }
  @media (hover: hover) {
    .label { opacity: 0; translate: 0 6px; }
    .atom:hover .label, .atom:focus-visible .label { opacity: 1; translate: 0 0; }
  }

  .ghost { --d: 9%; pointer-events: none; }
  .ghost .ball { position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, rgba(255, 255, 255, .85) 0 10%, rgba(250, 238, 220, .55) 30%, rgba(214, 192, 165, .55) 75%, rgba(190, 165, 135, .6));
    box-shadow: inset 0 0 0 1px rgba(150, 125, 100, .35), 0 8px 14px -8px rgba(80, 55, 30, .35); }

  /* Desktop: the mockup's layout */
  .core   { --x: 50%; --y: 47%; --d: 22%; --rw: 158%; --sym: clamp(44px, 5.6vw, 76px); }
  .festa  { --x: 25%; --y: 23%; --d: 14.5%; --rw: 152%; --sym: clamp(30px, 3.6vw, 50px); }
  .astro  { --x: 77%; --y: 72%; --d: 14.5%; --rw: 152%; --sym: clamp(30px, 3.6vw, 50px); }
  .ghost { --d: 10%; }
  .g1 { --x: 67%; --y: 16%; } .g2 { --x: 82%; --y: 40%; } .g3 { --x: 18%; --y: 60%; } .g4 { --x: 42%; --y: 85%; }
  .core .label  { left: 50%; top: 116%; translate: -50% 6px; justify-items: center; text-align: center; }
  .festa .label { right: 112%; top: 66%; justify-items: end; text-align: right; }
  .astro .label { left: 110%; top: 66%; }
  @media (hover: hover) { .core:hover .label, .core:focus-visible .label { translate: -50% 0; } }

  /* Phones: the zigzag from the phone mockup, details always showing */
  @media (max-aspect-ratio: 4/5) {
    .core  { --x: 32%; --y: 49%; --d: 36%; --sym: 48px; }
    .festa { --x: 66%; --y: 20%; --d: 25%; --sym: 34px; }
    .astro { --x: 68%; --y: 77%; --d: 27%; --sym: 36px; }
    .g1 { --x: 9%; --y: 66%; --d: 10%; } .g2 { --x: 88%; --y: 96%; --d: 9%; } .g3 { display: none; } .g4 { --x: 88%; --y: 4%; --d: 9%; }
    .core .label  { left: 124%; top: 50%; translate: 0 -50%; justify-items: start; text-align: left; max-width: 40vw; }
    .festa .label, .astro .label { left: auto; right: 122%; top: 50%; translate: 0 -50%; justify-items: end; text-align: right; max-width: 50vw; }
    .label { opacity: 1; }
  }

  @media (max-aspect-ratio: 4/5) and (max-width: 370px) {
    .core .label .go, .what, .go { font-size: 12.5px; } .core .label { left: 118%; }
    .festa .label, .astro .label { max-width: 42vw; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .molecule { animation: drift 8s ease-in-out infinite alternate; }
    @keyframes drift { to { translate: 0 -5px; } }
  }
</style>
</head>
<body>
<header>
  <span class="site">appdoivo.com</span>
  <button class="lang" id="lang" type="button">PT</button>
</header>

<main>
  <h1 class="sr">App do Ivo</h1>
  <div class="molecule" id="molecule">
    <svg class="ghosts" id="ghost-lines" aria-hidden="true"></svg>
    <div class="bond" data-to="festa" aria-hidden="true"></div>
    <div class="bond" data-to="astro" aria-hidden="true"></div>

    <div class="atom ghost g1" aria-hidden="true"><img class="ring" src="img/ring-small.webp?v=1" alt=""><span class="ball"></span></div>
    <div class="atom ghost g2" aria-hidden="true"><img class="ring" src="img/ring-small.webp?v=1" alt=""><span class="ball"></span></div>
    <div class="atom ghost g3" aria-hidden="true"><img class="ring" src="img/ring-small.webp?v=1" alt=""><span class="ball"></span></div>
    <div class="atom ghost g4" aria-hidden="true"><img class="ring" src="img/ring-small.webp?v=1" alt=""><span class="ball"></span></div>

    <a class="atom core" id="core" href="mailto:mail@ivolopes.com">
      <img class="ring" src="img/ring-big.webp?v=1" alt="">
      <img class="glass ball" src="img/atom-orange.webp?v=1" alt="">
      <span class="sym" aria-hidden="true">Ai</span>
      <span class="label"><span class="name">App do Ivo</span><span class="what" data-t="core"></span><span class="go">mail@ivolopes.com</span></span>
    </a>
    <a class="atom festa" id="festa" href="https://festa-demo.appdoivo.com">
      <img class="ring" src="img/ring-small.webp?v=1" alt="">
      <img class="glass ball" src="img/atom-blue.webp?v=1" alt="">
      <span class="sym" aria-hidden="true">Fe</span>
      <span class="label"><span class="name">Festa</span><span class="what" data-t="festa"></span><span class="go" data-t="festaGo"></span></span>
    </a>
    <a class="atom astro" id="astro" href="https://astro.appdoivo.com">
      <img class="ring" src="img/ring-small.webp?v=1" alt="">
      <img class="glass ball" src="img/atom-purple.webp?v=1" alt="">
      <span class="sym" aria-hidden="true">As</span>
      <span class="label"><span class="name">Astro</span><span class="what" data-t="astro"></span><span class="go" data-t="astroGo"></span></span>
    </a>
  </div>
</main>

<script>
  // Words in both languages. ?lang=, then the visitor's last choice, then the browser.
  const T = {
    en: { core: "Small apps for a bigger life.", festa: "Birthday Party App", festaGo: "Try the Demo →", astro: "The Sky Right Now", astroGo: "Open →", other: "PT", otherLabel: "Ver em português", desc: "Apps by Ivo Lopes. Each app is an atom in one molecule." },
    pt: { core: "Pequenas apps para uma vida maior.", festa: "App de Festa de Anos", festaGo: "Experimentar a Demo →", astro: "O Céu Neste Momento", astroGo: "Abrir →", other: "EN", otherLabel: "View in English", desc: "Apps de Ivo Lopes. Cada app é um átomo da mesma molécula." },
  };
  let saved = null; try { saved = localStorage.getItem("lang"); } catch (_) {}
  let lang = new URLSearchParams(location.search).get("lang") || saved || ((navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en");
  if (!T[lang]) lang = "en";
  const fill = () => {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t[el.dataset.t]));
    const b = document.getElementById("lang"); b.textContent = t.other; b.setAttribute("aria-label", `${t.other}: ${t.otherLabel}`);
    document.querySelector('meta[name="description"]').content = t.desc;
  };
  fill();
  document.getElementById("lang").addEventListener("click", () => {
    lang = lang === "pt" ? "en" : "pt";
    try { localStorage.setItem("lang", lang); } catch (_) {}
    fill();
  });

  // Bonds run from the centre of App do Ivo to each app, wherever the layout puts them
  const mol = document.getElementById("molecule");
  const centre = (el) => { const m = mol.getBoundingClientRect(), r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2 - m.left, y: r.top + r.height / 2 - m.top, d: r.width, show: r.width > 0 }; };
  function bonds() {
    const core = centre(document.getElementById("core"));
    document.querySelectorAll(".bond").forEach((b) => {
      const to = centre(document.getElementById(b.dataset.to));
      const dx = to.x - core.x, dy = to.y - core.y;
      b.style.left = `${core.x}px`; b.style.top = `${core.y}px`;
      b.style.width = `${Math.hypot(dx, dy)}px`; b.style.rotate = `${Math.atan2(dy, dx)}rad`;
      b.style.setProperty("--h", `${Math.max(8, to.d * 0.075)}px`);
    });
    const svg = document.getElementById("ghost-lines");
    svg.innerHTML = [...document.querySelectorAll(".ghost")].map(centre).filter((g) => g.show)
      .map((g) => `<line x1="${core.x}" y1="${core.y}" x2="${g.x}" y2="${g.y}"/>`).join("");
  }
  bonds(); addEventListener("resize", bonds); addEventListener("load", bonds);
</script>
</body>
</html>
