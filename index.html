<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App do Ivo · Small Apps for a Bigger Life</title>
<meta name="description" content="Small apps by Ivo Lopes, each one an object on the shelf: Festa, Astro, Job, and more to come.">
<meta property="og:title" content="App do Ivo · Small Apps for a Bigger Life">
<meta property="og:description" content="Small apps by Ivo Lopes, each one an object on the shelf.">
<meta property="og:url" content="https://appdoivo.com">
<meta property="og:type" content="website">
<meta property="og:image" content="https://appdoivo.com/og-image.png?v=3">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://appdoivo.com">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#c9a473" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a140f" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preload" as="image" href="img/shelf/wall-day.webp?v=2" media="(prefers-color-scheme: light)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* A bookshelf in warm afternoon light (by night: a dark wall and a candle).
     Every app is one object standing on the shelf with its name on a parchment
     plate pinned to the shelf's edge. A new app = one object image + one entry in
     APPS below. Images: ChatGPT parts cut out with macOS subject lifting
     (~/Downloads/appdoivo-refs/shelf-parts), never shown larger than they are. */
  :root {
    --ink: #2b1d10; --soft: #5c4128; --plate: #efe2c3; --plate-edge: #b48d55; --brass: #a8792f;
    --wall: #c9a473; --wall-img: url(img/shelf/wall-day.webp?v=2);
    --dim: 1; --leaves: .5; --glow: 0;
    --serif: "Cormorant Garamond", Georgia, serif; --text: "EB Garamond", Georgia, serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #f3e6cc; --soft: #d7c3a0; --wall: #1a140f; --wall-img: url(img/shelf/wall-night.webp?v=2); --dim: .74; --leaves: 0; --glow: 1; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --ink: #f3e6cc; --soft: #d7c3a0; --wall: #1a140f; --wall-img: url(img/shelf/wall-night.webp?v=2); --dim: .74; --leaves: 0; --glow: 1; color-scheme: dark; }

  * { box-sizing: border-box; }
  html { background: var(--wall); }
  body {
    margin: 0; min-height: 100svh; color: var(--ink); font: 18px/1.4 var(--text); overflow-x: clip; position: relative;
    background: var(--wall) var(--wall-img) center / cover no-repeat fixed;     /* one plaster wall, never tiled (tiles showed seams) */
    padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
    display: flex; flex-direction: column;
  }
  /* Daylight through a window: leaf shadows across the wall */
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: var(--leaves);
    background: url(img/shelf/leaves.webp?v=2) right top / max(100vw, 1100px) auto no-repeat; mix-blend-mode: multiply; }
  /* By night: the candle's warm glow */
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: var(--glow);
    background: radial-gradient(60vmax 45vmax at 82% 78%, rgba(255, 170, 80, .16), transparent 70%); }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 4px; border-radius: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .top { position: relative; z-index: 3; display: flex; justify-content: flex-end; gap: 8px; padding-top: max(12px, env(safe-area-inset-top)); }
  .btn { width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 1px solid color-mix(in srgb, var(--ink) 35%, transparent); border-radius: 10px;
    background: color-mix(in srgb, var(--plate) 25%, transparent); color: var(--ink); font: 500 15px var(--text); letter-spacing: .04em; cursor: pointer; backdrop-filter: blur(2px); }
  .btn:hover { border-color: var(--brass); }
  .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .btn .i-sun, .btn.is-dark .i-moon { display: none; }
  .btn.is-dark .i-sun { display: inline; }

  header.hero { position: relative; z-index: 2; text-align: center; margin-top: clamp(4px, 2vw, 20px); }
  h1 { font: 700 clamp(48px, 9vw, 96px)/1 var(--serif); margin: 0; letter-spacing: .005em; text-shadow: 0 1px 0 rgba(255, 240, 210, .25); }
  .tagline { font-size: clamp(19px, 2.6vw, 27px); color: var(--soft); margin: 8px 0 0; }

  /* The ivy hanging from the top left corner */
  .ivy { position: absolute; top: 0; left: 0; z-index: 1; width: clamp(110px, 15vw, 230px); height: auto; pointer-events: none; filter: brightness(var(--dim)); }

  main { position: relative; z-index: 2; flex: 1; display: grid; align-content: center; padding-block: clamp(24px, 5vw, 56px) 40px; }
  .shelf { position: relative; width: min(100%, 1180px); margin-inline: auto; }
  /* The objects stand on the board: a row of apps, with books and brass at the ends */
  .row { display: flex; align-items: flex-end; justify-content: center; gap: clamp(10px, 2.2vw, 34px); padding-inline: clamp(8px, 3vw, 40px); position: relative; z-index: 2; }
  .deco { flex: none; height: auto; filter: brightness(var(--dim)) drop-shadow(0 6px 6px rgba(40, 22, 8, .35)); pointer-events: none; }
  .books { width: clamp(70px, 9vw, 130px); }
  .vase { width: clamp(46px, 5.6vw, 82px); }
  .candle { width: clamp(30px, 3.6vw, 52px); }
  .candle-glow { position: relative; flex: none; display: flex; align-items: flex-end; gap: 6px; }
  .candle-glow::before { content: ""; position: absolute; left: 62%; top: -10%; width: 140px; height: 140px; translate: -50% -30%; border-radius: 50%; opacity: var(--glow);
    background: radial-gradient(closest-side, rgba(255, 196, 110, .55), rgba(255, 150, 60, .12) 60%, transparent); pointer-events: none; }

  .app { position: relative; flex: 0 1 230px; min-width: 0; display: flex; flex-direction: column; align-items: center; text-decoration: none; color: inherit; }
  .app img { width: 100%; max-width: 230px; height: auto; aspect-ratio: var(--ar); object-fit: contain; filter: brightness(var(--dim)) drop-shadow(0 10px 10px rgba(40, 22, 8, .38));
    transition: translate .35s ease, filter .35s ease; }
  a.app:hover img, a.app:focus-visible img { translate: 0 -6px; filter: brightness(calc(var(--dim) + .08)) drop-shadow(0 16px 14px rgba(40, 22, 8, .34)); }
  .app.festa::before { content: ""; position: absolute; inset: 22% 18% 26%; border-radius: 50%; opacity: var(--glow); pointer-events: none;
    background: radial-gradient(closest-side, rgba(255, 190, 90, .45), transparent); filter: blur(6px); }
  /* The board itself, and under it the parchment plates, one per app */
  .board { position: relative; z-index: 1; display: block; width: 100%; height: auto; aspect-ratio: 2088 / 121; margin-top: -1.2%;
    filter: brightness(var(--dim)) drop-shadow(0 14px 14px rgba(40, 22, 8, .4)); }
  .plates { position: relative; z-index: 3; display: flex; justify-content: center; align-items: stretch; gap: clamp(10px, 2.2vw, 34px); padding-inline: clamp(8px, 3vw, 40px); margin-top: calc(-1 * clamp(30px, 3.6vw, 46px)); }
  .plates > .plate-slot { flex: 0 1 230px; min-width: 0; display: flex; justify-content: center; align-items: stretch; }
  .plates .spacer { flex: none; visibility: hidden; height: 0; overflow: hidden; }
  .plate { flex: 0 1 190px; min-width: 0; display: grid; justify-items: center; align-content: center; text-align: center; gap: 1px;
    padding: 9px 14px 10px; border-radius: 2px; color: #2b1d10; text-decoration: none; align-content: start;
    background: radial-gradient(130% 160% at 50% 10%, #efe0bb, #e2cc9c 60%, #c9ab74); border: 1px solid #9c7840;
    box-shadow: 0 2px 0 rgba(255, 255, 255, .35) inset, 0 6px 12px rgba(40, 22, 8, .35); filter: brightness(calc(var(--dim) + .12)); position: relative; }
  .plate::before, .plate::after { content: ""; position: absolute; top: 6px; width: 6px; height: 6px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f3d28b, #8a5c1d); box-shadow: 0 1px 1px rgba(0, 0, 0, .4); }
  .plate::before { left: 6px; } .plate::after { right: 6px; }
  .plate b { font: 700 clamp(19px, 1.9vw, 24px)/1.1 var(--serif); }
  .plate span { font-size: clamp(13px, 1.25vw, 15.5px); line-height: 1.25; color: #5c4128; }
  a.plate:hover b { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .plate.soon { opacity: .9; }

  footer { position: relative; z-index: 2; text-align: center; padding-block: 8px max(18px, env(safe-area-inset-bottom)); font-size: 15px; color: var(--soft); }
  footer a { color: inherit; text-underline-offset: 3px; }

  /* Phones: one app per shelf, stacked; the ends of each shelf take turns holding a small object */
  @media (max-width: 720px) {
    .shelf + .shelf { margin-top: 28px; }
    .row { gap: 12px; }
    .app { flex: 0 1 200px; }
    .books { width: 74px; } .vase { width: 48px; } .candle { width: 32px; }
    .ivy { width: 96px; }
    .plates { margin-top: -22px; }
    .plates > .plate-slot { flex: 0 1 200px; }
  }
  @media (prefers-reduced-motion: reduce) { .app img { transition: none; } }
</style>
</head>
<body>
<img class="ivy" src="img/shelf/ivy.webp?v=2" alt="" width="520" height="790">
<div class="top">
  <button class="btn" id="mode" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/><g class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg></button>
  <button class="btn" id="lang" type="button">PT</button>
</div>
<header class="hero">
  <h1>App do Ivo</h1>
  <p class="tagline" data-t="tagline">Small Apps for a Bigger Life</p>
</header>
<main id="shelves" aria-label="Apps"></main>
<footer><a href="mailto:mail@ivolopes.com" data-t="mail">mail@ivolopes.com</a></footer>
<script>
  // The apps on the shelf, in order. To add one: its object image in img/shelf/ (cut out,
  // about 800 px) and one entry here. `href: null` is a spot that is not open yet.
  const APPS = [
    { id: "festa", img: "festa.webp", w: 758, h: 820, href: "https://festa-demo.appdoivo.com" },
    { id: "astro", img: "astro.webp", w: 644, h: 820, href: "https://astro.appdoivo.com" },
    { id: "job", img: "job.webp", w: 820, h: 765, href: "https://job.appdoivo.com" },
    { id: "soon", img: "soon.webp", w: 651, h: 820, href: null },
  ];
  const T = {
    en: { tagline: "Small Apps for a Bigger Life", mail: "mail@ivolopes.com", other: "PT", otherLabel: "Ver em português", toDark: "Dark Mode", toLight: "Light Mode", apps: "Apps",
      title: "App do Ivo · Small Apps for a Bigger Life",
      festa: ["Festa", "Celebrate the Days That Matter", "Festa, the birthday party app: try the demo"],
      astro: ["Astro", "The Sky at Any Moment", "Astro, the sky at any moment: open"],
      job: ["Job", "A CV for Every Job", "Job, a CV tailored to every job: open"],
      soon: ["Soon", "More to Come", "More apps to come"] },
    pt: { tagline: "Pequenas Apps para uma Vida Maior", mail: "mail@ivolopes.com", other: "EN", otherLabel: "View in English", toDark: "Modo Escuro", toLight: "Modo Claro", apps: "Apps",
      title: "App do Ivo · Pequenas Apps para uma Vida Maior",
      festa: ["Festa", "Celebrar os Dias Que Importam", "Festa, a app de festa de anos: experimentar a demo"],
      astro: ["Astro", "O Céu a Qualquer Momento", "Astro, o céu a qualquer momento: abrir"],
      job: ["Job", "Um CV para Cada Vaga", "Job, um CV à medida de cada vaga: abrir"],
      soon: ["Em Breve", "Mais a Caminho", "Mais apps a caminho"] },
  };
  let saved = null; try { saved = localStorage.getItem("lang"); } catch (_) {}
  let lang = new URLSearchParams(location.search).get("lang") || saved || ((navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en");
  if (!T[lang]) lang = "en";

  // Shelves: all apps on one shelf on a wide screen; one app per shelf on a phone
  const phone = matchMedia("(max-width: 720px)");
  const deco = {
    books: `<img class="deco books" src="img/shelf/books.webp?v=2" alt="" width="409" height="500">`,
    brass: `<span class="candle-glow"><img class="deco vase" src="img/shelf/vase.webp?v=2" alt="" width="352" height="600"><img class="deco candle" src="img/shelf/candle.webp?v=2" alt="" width="238" height="600"></span>`,
    plant: `<img class="deco books" src="img/shelf/plant.webp?v=2" alt="" width="500" height="448">`,
    sphere: `<img class="deco vase" src="img/shelf/sphere.webp?v=2" alt="" width="423" height="585">`,
  };
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function shelf(apps, left, right) {
    const t = T[lang];
    const obj = (a) => {
      const tag = a.href ? `a href="${a.href}"` : "div", end = a.href ? "a" : "div";
      return `<${tag} class="app ${a.id}" ${a.href ? `aria-label="${esc(t[a.id][2])}"` : `role="img" aria-label="${esc(t[a.id][2])}"`}><img src="img/shelf/${a.img}?v=2" alt="" width="${a.w}" height="${a.h}" style="--ar:${a.w}/${a.h}" loading="${apps[0].id === "festa" ? "eager" : "lazy"}" decoding="async"></${end}>`;
    };
    // The plates repeat the links as text (one tab stop per app is the object; the plate is for reading)
    const plate = (a) => `<${a.href ? `a href="${a.href}" tabindex="-1" aria-hidden="true"` : 'div aria-hidden="true"'} class="plate ${a.id === "soon" ? "soon" : ""}"><b>${esc(t[a.id][0])}</b><span>${esc(t[a.id][1])}</span></${a.href ? "a" : "div"}>`;
    const ends = (d) => (d ? `<span class="spacer">${d}</span>` : "");
    return `<section class="shelf"><div class="row">${left || ""}${apps.map(obj).join("")}${right || ""}</div>
      <img class="board" src="img/shelf/shelf.webp?v=2" alt="" width="2088" height="121">
      <div class="plates">${ends(left)}${apps.map((a) => `<span class="plate-slot">${plate(a)}</span>`).join("")}${ends(right)}</div></section>`;
  }
  function render() {
    const t = T[lang];
    document.documentElement.lang = lang; document.title = t.title;
    document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t[el.dataset.t]));
    document.getElementById("shelves").setAttribute("aria-label", t.apps);
    const b = document.getElementById("lang"); b.textContent = t.other; b.setAttribute("aria-label", `${t.other}: ${t.otherLabel}`);
    const ends = [[deco.books, ""], ["", deco.brass], [deco.plant, ""], ["", deco.sphere]];
    document.getElementById("shelves").innerHTML = phone.matches
      ? APPS.map((a, i) => shelf([a], ...ends[i % ends.length])).join("")
      : shelf(APPS, deco.books, deco.brass);
    paint();
  }
  // Dark or light: the device decides until a choice is made here
  const isDark = () => (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
  function paint() { const m = document.getElementById("mode"), d = isDark(); m.classList.toggle("is-dark", d); m.setAttribute("aria-label", d ? T[lang].toLight : T[lang].toDark); m.title = m.getAttribute("aria-label"); }
  document.getElementById("mode").addEventListener("click", () => { const n = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = n; try { localStorage.setItem("theme", n); } catch (_) {} paint(); });
  document.getElementById("lang").addEventListener("click", () => { lang = lang === "pt" ? "en" : "pt"; try { localStorage.setItem("lang", lang); } catch (_) {} render(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint);
  phone.addEventListener("change", render);
  render();
</script>
</body>
</html>
