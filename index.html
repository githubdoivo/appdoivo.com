<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- csp-meta: only this site's own scripts run (refresh with ~/bin/csp-meta after editing an inline script) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-2IF1OqlYQEsPupU5Mrj3Qv8UhEPG8o6AQ3j7c6CNrDo=' 'sha256-HP7qtzkDvTQrwBIE5cVG3Av946qu8h9AoY9tzcp2Ok4=' 'sha256-V5qJba2Pfl34pHXr5tflSMB61vARUx4poZzLZG+ElkI='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>App do Ivo · Small Apps for a Bigger Life</title>
<meta name="description" content="Small apps by Ivo Lopes, each one an object on the shelf: Festa, Astro, Journal, Job, Expenses, and more to come.">
<meta property="og:title" content="App do Ivo · Small Apps for a Bigger Life">
<meta property="og:description" content="Small apps by Ivo Lopes, each one an object on the shelf.">

<meta property="og:image" content="https://appdoivo.com/og-image.png?v=8">

<meta property="og:image:height" content="630">

<link rel="canonical" href="https://appdoivo.com">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2b1b0f">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preload" as="image" href="img/scene/shelf-desk.webp?v=2" media="(min-width: 721px)">
<link rel="preload" as="image" href="img/scene/shelf-phone.webp?v=2" media="(max-width: 720px)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* The hub is one painted scene (ChatGPT, ~/Downloads/appdoivo-refs/scene): a bookshelf in
     afternoon light, one object per app on a wooden stand with a blank parchment label.
     The words are real text laid over the labels, so they stay sharp and translate.
     The picture is never shown larger than it is; around it, a blurred copy of itself
     fills the screen. By night the same scene is dimmed and lit by a candle glow. */
  :root { --dim: 1; --sat: 1; --glow: 0; --ink: #2a1a0c; --sub: #2f1d0b; --title: #f6e8cc; --tagline: #e8d3ad; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --dim: .8; --sat: .92; --glow: 1; --title: #f6e8cc; --tagline: #e3cda5; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --dim: .8; --sat: .92; --glow: 1; --title: #f6e8cc; --tagline: #e3cda5; color-scheme: dark; }

  * { box-sizing: border-box; }
  /* Nothing is pinned (no position: fixed): iPhone Safari (iOS 26) paints a solid band over
     anything pinned to the top or bottom of the screen. The page itself never scrolls. */
  html { background: #2b1b0f; }
  html, body { height: 100%; overflow: hidden; }
  /* Phones: Safari's bottom bar sits a little below the "large" screen height,
     so the scene reaches that much further down. */
  :root { --below: 0px; }
  @media (pointer: coarse) { :root { --below: 120px; } }
  body { margin: 0; display: grid; place-items: center; overflow-x: clip; font-family: "EB Garamond", Georgia, serif; background: #2b1b0f; }
  :focus-visible { outline: 3px solid #f2c46d; outline-offset: 3px; border-radius: 8px; }

  /* The scene: as large as the screen allows, never larger than the picture itself */
  /* The scene fills the whole screen, like a background with "cover": no frame, no blur.
     Its edges are cropped on screens of another shape; the apps sit near the middle. */
  /* Reaches past every screen edge, so nothing shows behind floating browser bars */
  .stage { position: absolute; top: 0; left: 0; right: 0; height: calc(100vh + 160px + var(--below)); height: calc(100lvh + 160px + var(--below)); overflow: hidden; }
  /* --fx: the point of the picture (0 to 1 across) kept in the middle of the screen; the
     clamp stops the picture's edge from ever coming inside the screen */
  .scene { --w: 1536; --h: 1024; --fx: .5; --sw: max(100vw, calc((100lvh + var(--below)) * var(--w) / var(--h)));
    position: absolute; left: clamp(calc(100vw - var(--sw)), calc(50vw - var(--sw) * var(--fx)), 0px); top: calc(160px + (100lvh + var(--below)) / 2); translate: 0 -50%; z-index: 1; container-type: inline-size;
    width: var(--sw); aspect-ratio: var(--w) / var(--h); }
  .scene.phone { --fx: .62; }   /* the phone painting's objects sit right of centre */
  .scene > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; filter: brightness(var(--dim)) saturate(var(--sat)); }
  .scene::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: var(--glow); mix-blend-mode: screen;
    background: radial-gradient(45% 50% at 82% 55%, rgba(255, 170, 70, .28), transparent 70%), radial-gradient(30% 30% at 18% 52%, rgba(255, 190, 90, .18), transparent 70%); }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .tools { position: absolute; z-index: 3; top: calc(160px + max(14px, env(safe-area-inset-top))); right: max(14px, env(safe-area-inset-right)); display: flex; gap: 8px; }
  .btn { width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 1px solid rgba(255, 236, 200, .55); border-radius: 10px;
    background: rgba(40, 24, 12, .35); color: #f6e8cc; font: 500 15px "EB Garamond", Georgia, serif; letter-spacing: .04em; cursor: pointer; backdrop-filter: blur(3px); }
  .btn:hover { background: rgba(40, 24, 12, .55); }
  .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .btn .i-sun, .btn.is-dark .i-moon { display: none; }
  .btn.is-dark .i-sun { display: inline; }

  /* Each app: a link over its object and stand, and its words on the label */
  .app { position: absolute; z-index: 2; display: block; border-radius: 12px; text-decoration: none; color: var(--ink); }
  /* Touching or pointing at an object lights it softly, like a lamp turned toward it
     (instead of the browser's grey tap box, which showed the link's square edges) */
  a.app { -webkit-tap-highlight-color: transparent; outline: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
  /* Holding the painting or an object shows no lifted copy or save menu */
  .scene > img { -webkit-touch-callout: none; -webkit-user-drag: none; -webkit-user-select: none; user-select: none; pointer-events: none; }
  /* The light: a small warm glow, like a firefly, appears on the object and breathes */
  a.app::before { content: ""; position: absolute; left: var(--cx, 50%); top: 40%; width: 34%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, #fff6dc 0 9%, rgba(255, 214, 140, .95) 16%, rgba(255, 180, 90, .45) 38%, rgba(255, 160, 70, .12) 62%, transparent 72%);
    opacity: 0; scale: .4; transition: opacity .3s ease, scale .45s cubic-bezier(.2, 1.4, .4, 1); }
  a.app:hover::before, a.app:focus-visible::before { opacity: .85; scale: 1; animation: breathe 2.4s ease-in-out .45s infinite; }
  a.app:active::before { opacity: 1; scale: 1.25; transition-duration: .12s; }
  @keyframes breathe { 50% { opacity: .55; scale: .82; } }
  @media (prefers-reduced-motion: reduce) { a.app::before { transition: none; animation: none !important; } }
  /* No plaques: an app's name appears just under its object while the object is lit
     (hovered, focused or tapped). Screen readers always get it. */
  .label { position: absolute; left: var(--cx, 50%); width: 140%; margin-left: -70%; top: 100%; display: grid; justify-items: center; text-align: center; gap: 2px; padding-top: 6px; pointer-events: none;
    opacity: 0; translate: 0 -4px; transition: opacity .35s ease, translate .35s ease; }
  a.app:hover .label, a.app:focus-visible .label, a.app:active .label { opacity: 1; translate: 0 0; }
  .label b { font: 700 var(--name)/1.05 "Cormorant Garamond", Georgia, serif; color: #fbeccd; text-shadow: 0 1px 3px rgba(0, 0, 0, .9), 0 0 14px rgba(0, 0, 0, .7); }
  .label span { font-size: var(--small); line-height: 1.15; color: #f0dcb4; text-shadow: 0 1px 3px rgba(0, 0, 0, .9); }
  .scene.desk .app { --name: 2.2cqw; --small: 1.15cqw; }
  .scene.phone .app { --name: 5cqw; --small: 0; }
  .scene.phone .label span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }   /* phones show the name; the line stays for screen readers */

  body.debug .label { outline: 2px solid #f0f; } body.debug .app { outline: 1px dashed #0ff; }
</style>
</head>
<body>
<div class="stage">
  <div class="scene" id="scene">
    <img id="scene-img" alt="">
    <h1 class="sr">App do Ivo</h1>
    <nav id="apps" aria-label="Apps"></nav>
  </div>
</div>
<div class="tools">
  <button class="btn" id="mode" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/><g class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg></button>
  <button class="btn" id="lang" type="button">PT</button>
</div>
<script>
  // Where each app sits in each picture, in % of the picture: the object and stand
  // (x, y, w, h). To add an app: ask ChatGPT
  // for the scene with the new object, then measure its box here (?debug shows the boxes).
  const SCENES = {
    desk: { src: "img/scene/shelf-desk.webp?v=2", w: 1536, h: 1024, apps: {
      festa: [27.3, 12.7, 18.1, 31.4], astro: [47.0, 12.3, 18.5, 32.0], journal: [65.0, 22.0, 20.4, 22.3],
      job: [21.5, 52.3, 25.4, 23.6, 37], expenses: [48.5, 54.2, 15.7, 21.7], soon: [67.3, 49.2, 13.7, 26.7] } },
    phone: { src: "img/scene/shelf-phone.webp?v=2", w: 1024, h: 1536, apps: {
      festa: [36.4, 5.9, 21.3, 19.7], astro: [40.0, 29.5, 22.6, 16.2], journal: [61.0, 11.0, 29.5, 14.6],
      job: [34.8, 50.5, 40.7, 15.3, 36], expenses: [34.1, 72.0, 24.3, 14.9], soon: [60.0, 69.4, 18.7, 17.5] } },
  };
  const APPS = [
    { id: "festa", href: "https://festa-demo.appdoivo.com" },
    { id: "astro", href: "https://astro.appdoivo.com" },
    { id: "journal", href: "https://journal.appdoivo.com" },
    { id: "job", href: "https://job.appdoivo.com" },
    { id: "expenses", href: "https://expenses.appdoivo.com" },
    { id: "soon", href: null },
  ];
  const T = {
    en: { tagline: "Small Apps for a Bigger Life", other: "PT", otherLabel: "Ver em português", toDark: "Dark Mode", toLight: "Light Mode", apps: "Apps",
      title: "App do Ivo · Small Apps for a Bigger Life", alt: "A bookshelf in afternoon light with a jar holding a mossy cottage, a star globe, a stack of notebooks with an instant photo, a typewriter, a leather ledger with a coin purse and a glass dome with a sprout.",
      festa: ["Festa", "Celebrate the Days That Matter", "Festa, the birthday party app: try the demo"],
      astro: ["Astro", "The Sky at Any Moment", "Astro, the sky at any moment"],
      job: ["Job", "A CV for Every Job", "Job, a CV tailored to every job"],
      journal: ["Journal", "A Quiet Place for Your Mind", "Journal, a private diary, notes and photo albums"],
      expenses: ["Expenses", "Your Money, Month by Month", "Expenses, your money month by month"],
      soon: ["Soon", "More to Come", "More apps to come"] },
    pt: { tagline: "Pequenas Apps para uma Vida Maior", other: "EN", otherLabel: "View in English", toDark: "Modo Escuro", toLight: "Modo Claro", apps: "Apps",
      title: "App do Ivo · Pequenas Apps para uma Vida Maior", alt: "Uma estante à luz da tarde com um frasco com uma casa entre o musgo, um globo de estrelas, uma pilha de cadernos com uma fotografia instantânea, uma máquina de escrever, um livro de contas com um porta-moedas e uma redoma com um rebento.",
      festa: ["Festa", "Celebrar os Dias Que Importam", "Festa, a app de festa de anos: experimentar a demo"],
      astro: ["Astro", "O Céu a Qualquer Momento", "Astro, o céu a qualquer momento"],
      job: ["Job", "Um CV para Cada Vaga", "Job, um CV à medida de cada vaga"],
      journal: ["Diário", "Um Lugar Calmo para a Mente", "Diário, um diário privado, notas e álbuns de fotos"],
      expenses: ["Despesas", "O Seu Dinheiro, Mês a Mês", "Despesas, o seu dinheiro mês a mês"],
      soon: ["Em Breve", "Mais a Caminho", "Mais apps a caminho"] },
  };
  let saved = null; try { saved = localStorage.getItem("lang"); } catch (_) {}
  let lang = new URLSearchParams(location.search).get("lang") || saved || ((navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en");
  if (!T[lang]) lang = "en";
  if (new URLSearchParams(location.search).has("debug")) document.body.classList.add("debug");
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const phone = matchMedia("(max-width: 720px), (max-aspect-ratio: 4/5)");

  function render() {
    const t = T[lang], kind = phone.matches ? "phone" : "desk", s = SCENES[kind];
    document.documentElement.lang = lang; document.title = t.title;
    document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t[el.dataset.t]));
    const scene = $("scene"); scene.className = `scene ${kind}`; scene.style.setProperty("--w", s.w); scene.style.setProperty("--h", s.h);
    const img = $("scene-img"); if (!img.src.endsWith(s.src)) { img.src = s.src; img.width = s.w; img.height = s.h; }
    img.alt = t.alt;
    $("apps").setAttribute("aria-label", t.apps);
    $("apps").innerHTML = APPS.map((a) => {
      // cx: where the object's middle is inside its box (the typewriter's box also holds the tape measure)
      const [x, y, w, h, cx = 50] = s.apps[a.id];
      const style = `left:${x}%;top:${y}%;width:${w}%;height:${h}%;--cx:${cx}%`;
      // A link is named by the words on its label; "Soon" is a picture with a name, not a link
      return a.href
        ? `<a draggable="false" class="app ${a.id}" href="${a.href}" style="${style}"><span class="label"><b>${esc(t[a.id][0])}</b> <span>${esc(t[a.id][1])}</span></span></a>`
        : `<div class="app ${a.id}" role="img" aria-label="${esc(t[a.id][2])}" style="${style}"><span class="label" aria-hidden="true"><b>${esc(t[a.id][0])}</b><span>${esc(t[a.id][1])}</span></span></div>`;
    }).join("");
    const b = $("lang"); b.textContent = t.other; b.setAttribute("aria-label", `${t.other}: ${t.otherLabel}`);
    paint();
  }
  // Dark or light: the device decides until a choice is made here
  const isDark = () => (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
  function paint() { const m = $("mode"), d = isDark(); m.classList.toggle("is-dark", d); m.setAttribute("aria-label", d ? T[lang].toLight : T[lang].toDark); m.title = m.getAttribute("aria-label"); }
  $("mode").addEventListener("click", () => { const n = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = n; try { localStorage.setItem("theme", n); } catch (_) {} paint(); });
  $("lang").addEventListener("click", () => { lang = lang === "pt" ? "en" : "pt"; try { localStorage.setItem("lang", lang); } catch (_) {} render(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint);
  phone.addEventListener("change", render);
  render();
</script>
<!-- iPhone Safari fills the area behind the clock with whatever lies just above the
     top of the screen. The painting starts 160px above it, and the window opens scrolled
     down by exactly that and stays there, so the clock sits on the painting. -->
<script>
(function () {
  var y = 160;
  function keep() { if (Math.abs(window.scrollY - y) > 0.5) window.scrollTo(0, y); }
  keep();
  document.addEventListener("DOMContentLoaded", keep);
  window.addEventListener("load", keep);
  window.addEventListener("resize", keep);
  window.addEventListener("pageshow", keep);
  window.addEventListener("scroll", keep, { passive: true });
})();
</script>
</body>
