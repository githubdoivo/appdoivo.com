<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- csp-meta: only this site's own scripts run (refresh with ~/bin/csp-meta after editing an inline script) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-2IF1OqlYQEsPupU5Mrj3Qv8UhEPG8o6AQ3j7c6CNrDo=' 'sha256-fmYvokwQFRQHL01P/nlvNUsC+NI440Z+fOXkDYm4h8I='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>App do Ivo · Small Apps for a Bigger Life</title>
<meta name="description" content="Small apps by Ivo Lopes, each one an object on the shelf: lodgedoivo, astrodoivo, quilldoivo, draftdoivo, tallydoivo, and more to come.">
<meta property="og:title" content="App do Ivo · Small Apps for a Bigger Life">
<meta property="og:description" content="Small apps by Ivo Lopes, each one an object on the shelf.">
<meta property="og:url" content="https://appdoivo.com">
<meta property="og:type" content="website">
<meta property="og:image" content="https://appdoivo.com/og-image.png?v=8">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://appdoivo.com">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2b1b0f">
<meta name="color-scheme" content="light">
<link rel="preload" as="image" href="img/scene/shelf-desk.webp?v=5" media="(min-width: 721px)">
<link rel="preload" as="image" href="img/scene/shelf-phone.webp?v=6" media="(max-width: 720px)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* The hub is one painted scene (ChatGPT, ~/Downloads/appdoivo-refs/scene): a bookshelf in
     afternoon light, one object per app on a wooden stand with a blank parchment label.
     The words are real text laid over the labels, so they stay sharp and translate.
     The picture is never shown larger than it is; around it, a blurred copy of itself
     fills the screen. */
  /* One look, always (the dark/light switch was removed on 2026-11-05: the painting is the light) */
  :root { --ink: #2a1a0c; --sub: #2f1d0b; --title: #f6e8cc; --tagline: #e8d3ad; color-scheme: light; }

  * { box-sizing: border-box; }
  /* Nothing is pinned (no position: fixed): iPhone Safari (iOS 26) paints a solid band over
     anything pinned to the top or bottom of the screen. The page itself never scrolls. */
  html { background: #2b1b0f; }
  html, body { height: 100%; overflow: hidden; }
  /* Phones: Safari's bottom bar sits a little below the "large" screen height,
     so the scene reaches that much further down. */
  :root { --below: 0px; }
  @media (pointer: coarse) { :root { --below: 120px; } }
  body { margin: 0; display: grid; place-items: center; overflow-x: clip; font-family: "EB Garamond", Georgia, serif; background: #2b1b0f; }
  :focus-visible { outline: 3px solid #f2c46d; outline-offset: 3px; border-radius: 8px; }

  /* The scene: as large as the screen allows, never larger than the picture itself */
  /* The scene fills the whole screen, like a background with "cover": no frame, no blur.
     Its edges are cropped on screens of another shape; the apps sit near the middle. */
  /* Reaches past every screen edge, so nothing shows behind floating browser bars */
  .stage { position: absolute; top: 0; left: 0; right: 0; height: calc(100vh + 160px + var(--below)); height: calc(100lvh + 160px + var(--below)); overflow: hidden; }
  /* --fx: the point of the picture (0 to 1 across) kept in the middle of the screen; the
     clamp stops the picture's edge from ever coming inside the screen */
  .scene { --w: 1536; --h: 1024; --fx: .5; --sw: max(100vw, calc((100lvh + var(--below)) * var(--w) / var(--h)));
    position: absolute; left: clamp(calc(100vw - var(--sw)), calc(50vw - var(--sw) * var(--fx)), 0px); --sh: calc(var(--sw) * var(--h) / var(--w)); --fy: .38; top: calc(160px + clamp(calc(100lvh + var(--below) - var(--sh)), calc((100lvh + var(--below)) / 2 - var(--sh) * var(--fy)), 0px)); z-index: 1; container-type: inline-size;
    width: var(--sw); aspect-ratio: var(--w) / var(--h); }
  /* Phone (2026-11-05, no rug): the whole shelf stays on screen. The picture is shown a
     little smaller than "cover" (80% of its width fits the screen), its top at the screen's
     top; below, it fades into the same dark wall colour, which fills the rest. */
  .scene.phone { --sw: calc(100vw * 1.25); left: calc(50vw - var(--sw) * .51); top: 160px; }
  /* No end to the page (like ivolopes.com): above and below the painting, a mirrored copy of
     it continues the wall, so no solid band ever shows behind the clock or the browser bars. */
  .scene::before, .scene::after { content: ""; position: absolute; left: 0; width: 100%; height: 100%; background: var(--src) center / 100% 100% no-repeat; transform: scaleY(-1); pointer-events: none; }
  .scene::before { bottom: 100%; } .scene::after { top: 100%; }
  /* phone: below the shelves only the plain wall at the painting's foot continues (no upside-down shelves behind the browser bar) */
  .scene.phone::after { background-size: 100% 900%; background-position: bottom; }
  @media (min-aspect-ratio: 3/5) { .scene.phone { --sw: max(100vw, calc((100lvh + var(--below)) * var(--w) / var(--h))); left: clamp(calc(100vw - var(--sw)), calc(50vw - var(--sw) * .51), 0px); } }
  .scene > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* Each app: a link over its object and stand, and its words on the label */
  .app { position: absolute; z-index: 2; display: block; border-radius: 12px; text-decoration: none; color: var(--ink); }
  /* Touching or pointing at an object lights it softly, like a lamp turned toward it
     (instead of the browser's grey tap box, which showed the link's square edges) */
  a.app { -webkit-tap-highlight-color: transparent; outline: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
  /* Holding the painting or an object shows no lifted copy or save menu */
  .scene > img { -webkit-touch-callout: none; -webkit-user-drag: none; -webkit-user-select: none; user-select: none; pointer-events: none; }
  /* The light: when pointed at, the object itself brightens softly, like a warm lamp turned
     toward it: the picture under the object's area is lifted (backdrop brightness) with a
     soft oval edge that follows the object's own box, plus a faint warm tint. No dot. */
  a.app::before { content: ""; position: absolute; inset: -8% -6%; border-radius: 50%; pointer-events: none;
    -webkit-backdrop-filter: brightness(1.28) saturate(1.12); backdrop-filter: brightness(1.28) saturate(1.12);
    background: radial-gradient(closest-side, rgba(255, 214, 150, .16), rgba(255, 196, 120, .07) 60%, transparent);
    -webkit-mask: radial-gradient(closest-side, #000 52%, rgba(0, 0, 0, .55) 74%, transparent); mask: radial-gradient(closest-side, #000 52%, rgba(0, 0, 0, .55) 74%, transparent);
    opacity: 0; transition: opacity .45s ease; }
  a.app:hover::before, a.app:focus-visible::before { opacity: 1; animation: glow 3.2s ease-in-out .5s infinite; }
  a.app:active::before { opacity: 1; transition-duration: .12s; }
  @keyframes glow { 50% { opacity: .78; } }
  @media (prefers-reduced-motion: reduce) { a.app::before { transition: none; animation: none !important; } }
  /* No plaques: an app's name appears just under its object while the object is lit
     (hovered, focused or tapped). Screen readers always get it. */
  .label { position: absolute; left: var(--cx, 50%); width: 140%; margin-left: -70%; top: 100%; display: grid; justify-items: center; text-align: center; gap: 2px; padding-top: 6px; pointer-events: none;
    opacity: 0; translate: 0 -4px; transition: opacity .35s ease, translate .35s ease; }
  a.app:hover .label, a.app:focus-visible .label, a.app:active .label, a.app.lit .label { opacity: 1; translate: 0 0; }
  a.app.lit::before { opacity: 1; transition-duration: .2s; }
  .label b { font: 700 var(--name)/1.05 "Cormorant Garamond", Georgia, serif; color: #fbeccd; text-shadow: 0 1px 3px rgba(0, 0, 0, .9), 0 0 14px rgba(0, 0, 0, .7); }
  .label span { font-size: var(--small); line-height: 1.15; color: #f0dcb4; text-shadow: 0 1px 3px rgba(0, 0, 0, .9); }
  .scene.desk { --fy: .5; }   /* the zoomed-out painting (2026-11-05): shelves in the middle, wall around */
  .scene.desk .app { --name: 1.9cqw; --small: 1cqw; }
  .scene.phone .app { --name: 5cqw; --small: 0; }
  .scene.phone .label span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }   /* phones show the name; the line stays for screen readers */

  body.debug .label { outline: 2px solid #f0f; } body.debug .app { outline: 1px dashed #0ff; }
</style>
</head>
<body>
<div class="stage">
  <div class="scene" id="scene">
    <img id="scene-img" alt="">
    <h1 class="sr">App do Ivo</h1>
    <nav id="apps" aria-label="Apps"></nav>
  </div>
</div>
<script>
  // Where each app sits in each picture, in % of the picture: the object and stand
  // (x, y, w, h). To add an app: ask ChatGPT
  // for the scene with the new object, then measure its box here (?debug shows the boxes).
  const SCENES = {
    desk: { src: "img/scene/shelf-desk.webp?v=5", w: 1536, h: 1024, apps: {
      lodge: [29.6, 22.7, 15.0, 23.2], astro: [47.9, 20.0, 11.7, 26.1], quill: [60.9, 22.5, 19.1, 23.4, 25],
      draft: [30.1, 53.9, 17.3, 19.3], tally: [52.1, 55.2, 11.2, 18.1], soon: [65.4, 52.1, 9.4, 21.2] } },
    phone: { src: "img/scene/shelf-phone.webp?v=6", w: 1024, h: 1536, apps: {
      lodge: [34.2, 20.8, 25.4, 18.0], astro: [62.5, 19.5, 18.6, 19.4], quill: [26.9, 41.7, 33.2, 17.5, 40],
      tally: [58.1, 45.6, 17.1, 13.2], draft: [31.3, 64.1, 27.3, 15.6], soon: [61.3, 62.6, 16.3, 17.3] } },
  };
  const APPS = [
    { id: "lodge", href: "https://lodge.appdoivo.com" },
    { id: "astro", href: "https://astro.appdoivo.com" },
    { id: "quill", href: "https://quill.appdoivo.com" },
    { id: "draft", href: "https://draft.appdoivo.com" },
    { id: "tally", href: "https://tally.appdoivo.com" },
    { id: "soon", href: null },
  ];
  const T = {
    en: { tagline: "Small Apps for a Bigger Life", other: "PT", otherLabel: "Ver em português", apps: "Apps",
      title: "App do Ivo · Small Apps for a Bigger Life", alt: "Open bookshelves in afternoon light: a little lit house with a brass key, a brass astrolabe, a quill in an inkwell beside an open notebook, a typewriter, a leather ledger with coins and a glass dome with a sprout.",
      lodge: ["lodgedoivo", "Friends, a House and a Party", "lodgedoivo, the birthday weekend with friends"],
      astro: ["astrodoivo", "The Sky at Any Moment", "astrodoivo, the sky at any moment"],
      draft: ["draftdoivo", "A CV for Every Job", "draftdoivo, a CV tailored to every job"],
      quill: ["quilldoivo", "A Quiet Place for Your Mind", "quilldoivo, a private diary, notes and photo albums"],
      tally: ["tallydoivo", "Your Money, Month by Month", "tallydoivo, your money month by month"],
      soon: ["Soon", "More to Come", "More apps to come"] },
    pt: { tagline: "Pequenas Apps para uma Vida Maior", other: "EN", otherLabel: "View in English", apps: "Apps",
      title: "App do Ivo · Pequenas Apps para uma Vida Maior", alt: "Estantes à luz da tarde: uma casinha iluminada com uma chave de latão, um astrolábio, uma pena num tinteiro junto a um caderno aberto, uma máquina de escrever, um livro de contas com moedas e uma redoma com um rebento.",
      lodge: ["lodgedoivo", "Amigos, uma Casa e uma Festa", "lodgedoivo, o fim de semana de anos com os amigos"],
      astro: ["astrodoivo", "O Céu a Qualquer Momento", "astrodoivo, o céu a qualquer momento"],
      draft: ["draftdoivo", "Um CV para Cada Vaga", "draftdoivo, um CV à medida de cada vaga"],
      quill: ["quilldoivo", "Um Lugar Calmo para a Mente", "quilldoivo, um diário privado, notas e álbuns de fotos"],
      tally: ["tallydoivo", "O Seu Dinheiro, Mês a Mês", "tallydoivo, o seu dinheiro mês a mês"],
      soon: ["Em Breve", "Mais a Caminho", "Mais apps a caminho"] },
  };
  // No language switch (app names don't translate): the browser's language decides the words
  let lang = new URLSearchParams(location.search).get("lang") || ((navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en");
  if (!T[lang]) lang = "en";
  if (new URLSearchParams(location.search).has("debug")) document.body.classList.add("debug");
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const phone = matchMedia("(max-width: 720px), (max-aspect-ratio: 4/5)");

  function render() {
    const t = T[lang], kind = phone.matches ? "phone" : "desk", s = SCENES[kind];
    document.documentElement.lang = lang; document.title = t.title;
    document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t[el.dataset.t]));
    const scene = $("scene"); scene.className = `scene ${kind}`; scene.style.setProperty("--w", s.w); scene.style.setProperty("--h", s.h);
    const img = $("scene-img"); if (!img.src.endsWith(s.src)) { img.src = s.src; img.width = s.w; img.height = s.h; scene.style.setProperty("--src", `url("${s.src}")`); }
    img.alt = t.alt;
    $("apps").setAttribute("aria-label", t.apps);
    $("apps").innerHTML = APPS.map((a) => {
      // cx: where the object's middle is inside its box (the typewriter's box also holds the tape measure)
      const [x, y, w, h, cx = 50] = s.apps[a.id];
      const style = `left:${x}%;top:${y}%;width:${w}%;height:${h}%;--cx:${cx}%`;
      // A link is named by the words on its label; "Soon" is a picture with a name, not a link
      return a.href
        ? `<a draggable="false" class="app ${a.id}" href="${a.href}" aria-label="${esc(t[a.id][2])}" style="${style}"><span class="label" aria-hidden="true"><b>${esc(t[a.id][0])}</b></span></a>`
        : `<div class="app ${a.id}" role="img" aria-label="${esc(t[a.id][2])}" style="${style}"><span class="label" aria-hidden="true"><b>${esc(t[a.id][0])}</b></span></div>`;
    }).join("");
  }
  phone.addEventListener("change", render);
  // On touch screens a tap first lights the object and shows its name for a moment, then
  // opens the app (a tap has no hover, so the light was never seen before leaving).
  const touch = matchMedia("(hover: none)"), calm = matchMedia("(prefers-reduced-motion: reduce)");
  $("apps").addEventListener("click", (e) => {
    const a = e.target.closest("a.app"); if (!a || !touch.matches || e.metaKey || e.ctrlKey) return;
    e.preventDefault();
    document.querySelectorAll("a.app.lit").forEach((x) => x.classList.remove("lit"));
    a.classList.add("lit");
    setTimeout(() => { location.href = a.href; }, calm.matches ? 250 : 700);
  });
  window.addEventListener("pageshow", () => document.querySelectorAll("a.app.lit").forEach((x) => x.classList.remove("lit")));
  render();
</script>
<!-- iPhone Safari fills the area behind the clock with whatever lies just above the
     top of the screen. The painting starts 160px above it, and the window opens scrolled
     down by exactly that and stays there, so the clock sits on the painting. -->
<script>
(function () {
  var y = 160;
  function keep() { if (Math.abs(window.scrollY - y) > 0.5) window.scrollTo(0, y); }
  keep();
  document.addEventListener("DOMContentLoaded", keep);
  window.addEventListener("load", keep);
  window.addEventListener("resize", keep);
  window.addEventListener("pageshow", keep);
  window.addEventListener("scroll", keep, { passive: true });
})();
</script>
</body>
